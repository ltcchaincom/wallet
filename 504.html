<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>504 - Connection Timeout</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #ffffff;
    color: #1f2937;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
}

/* Background */

.background {
    position: fixed;
    inset: 0;
    z-index: -1;
}

svg {
    width: 100%;
    height: 100%;
}

.line {
    stroke: #d7dde8;
    stroke-width: 1.5;
}

.node {
    fill: #4f8cff;
}

.container {
    width: 90%;
    max-width: 700px;
    text-align: center;
    background: rgba(255,255,255,.95);
    padding: 50px;
    border-radius: 18px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 12px 40px rgba(0,0,0,.06);
}

h1 {
    font-size: 32px;
    margin-bottom: 18px;
}

p {
    color: #6b7280;
    font-size: 17px;
    line-height: 1.7;
}

.note {
    margin-top: 30px;
    padding: 18px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    color: #4b5563;
    font-size: 15px;
}

@media (max-width: 600px) {
    .container {
        padding: 35px 24px;
    }

    h1 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="background">
<svg xmlns="http://www.w3.org/2000/svg">

    <!-- Connections -->
    <line class="line" x1="10%" y1="20%" x2="28%" y2="35%" />
    <line class="line" x1="28%" y1="35%" x2="48%" y2="18%" />
    <line class="line" x1="48%" y1="18%" x2="70%" y2="30%" />
    <line class="line" x1="70%" y1="30%" x2="90%" y2="18%" />

    <line class="line" x1="18%" y1="75%" x2="42%" y2="60%" />
    <line class="line" x1="42%" y1="60%" x2="63%" y2="78%" />
    <line class="line" x1="63%" y1="78%" x2="84%" y2="62%" />

    <!-- Nodes -->
    <circle class="node" cx="10%" cy="20%" r="5"/>
    <circle class="node" cx="28%" cy="35%" r="5"/>
    <circle class="node" cx="48%" cy="18%" r="5"/>
    <circle class="node" cx="70%" cy="30%" r="5"/>
    <circle class="node" cx="90%" cy="18%" r="5"/>

    <circle class="node" cx="18%" cy="75%" r="5"/>
    <circle class="node" cx="42%" cy="60%" r="5"/>
    <circle class="node" cx="63%" cy="78%" r="5"/>
    <circle class="node" cx="84%" cy="62%" r="5"/>

</svg>
</div>

<div class="container">

<img src="img/logos/logo.webp" width="100"><br>

<h1>Connection Timeout</h1>

<p>
The request may still be processing,<br>but the connection exceeded the allowed time.
</p>

<div class="note">
⛓️ The decentralized network is still processing blocks.<br><br>
Please wait a few moments and refresh the page.<br>
The network should recover automatically once the upstream node becomes available.
</div>

</div>

</body>
</html>
